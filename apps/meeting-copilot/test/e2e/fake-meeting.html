<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fake Meeting</title></head>
<body style="font-family:system-ui;background:#202124;color:#fff;display:grid;place-items:center;height:100vh;margin:0">
  <!-- Stand-in for a Teams/Zoom tab: plays remote.wav so Meeting Copilot can capture it as tab audio.
       Chrome is launched with --auto-select-tab-capture-source-by-title=Fake Meeting.
       With ?slides it also shows a slide deck that moves on every 15 s, for slide-aware notes. -->
  <div><h1>🎥 Fake Meeting</h1><p id="s">Waiting…</p><audio id="a" src="remote.wav" loop></audio></div>
  <script>
    const a = document.getElementById('a'), s = document.getElementById('s');
    a.play().then(() => (s.textContent = 'Playing remote speaker audio (loops)')).catch((e) => (s.textContent = 'Autoplay blocked: ' + e.message));
  </script>
  <script>
    const SLIDES = [
      ['Q3 Pricing Plan', ['Basic: RM 49 per month', 'Pro: RM 129 per month (+12% vs Q2)', 'Launch on 1 March']],
      ['Rollout Timeline', ['Pilot with 20 customers in February', 'All customers from 1 March', 'Support hotline extended to 10 pm']],
      ['Q3 Pricing Plan', ['Basic: RM 49 per month', 'Pro: RM 129 per month (+12% vs Q2)', 'Launch on 1 March']],
      ['Risks', ['Payment gateway certificate renewal', 'Two support staff on leave in March']],
    ];
    if (new URLSearchParams(location.search).has('slides')) {
      const show = (i) => {
        const [title, points] = SLIDES[i % SLIDES.length];
        document.body.style.cssText = 'font-family:Arial,sans-serif;background:#fff;color:#1f1f1f;margin:0;height:100vh;padding:6vh 8vw;box-sizing:border-box';
        document.body.innerHTML = '<h1 style="font-size:7vh;border-bottom:6px solid #0b57d0;padding-bottom:2vh">' + title + '</h1><ul style="font-size:4.5vh;line-height:1.8">' +
          points.map((p) => '<li>' + p + '</li>').join('') + '</ul>';
        document.body.append(a);
      };
      let i = 0;
      show(0);
      setInterval(() => show(++i), 15000);
    }
  </script>
</body>
</html>
